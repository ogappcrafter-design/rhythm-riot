name: Deploy PWA to GitHub Pages

# Publishes the built web app to GitHub Pages so it can be installed to a phone's Home Screen
# (iPhone or Android) as a fast, offline PWA — no app store, no laptop. Requires the repo to be
# public (free Pages). URL: https://ogappcrafter-design.github.io/rhythm-riot/
on:
  push:
    branches: [claude/new-session-0h125a]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
