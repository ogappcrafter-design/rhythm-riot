<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181242"/>
      <stop offset="0.5" stop-color="#0a0c1e"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="vp" cx="0.5" cy="0.06" r="0.7">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef0ff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="sglow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#8ef0ff" flood-opacity="0.9"/>
    </filter>
    <g id="star">
      <path d="M0 -30 8.8 -9 31 -6 14 8 18 30 0 18 -18 30 -14 8 -31 -6 -8.8 -9Z"
        fill="#0a0c18" stroke="url(#rim)" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="-8" cy="-10" r="4" fill="#ffffff" opacity="0.8"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#vp)"/>
  <!-- converging note highway -->
  <g stroke="#ffffff" stroke-width="3">
    <line x1="512" y1="30" x2="70" y2="1024" stroke-opacity="0.4"/>
    <line x1="512" y1="30" x2="300" y2="1024" stroke-opacity="0.5"/>
    <line x1="512" y1="30" x2="512" y2="1024" stroke-opacity="0.55"/>
    <line x1="512" y1="30" x2="724" y2="1024" stroke-opacity="0.5"/>
    <line x1="512" y1="30" x2="954" y2="1024" stroke-opacity="0.4"/>
  </g>
  <!-- hit rings near base -->
  <g fill="none" stroke="#8ef0ff" stroke-width="5" filter="url(#sglow)" opacity="0.9">
    <circle cx="150" cy="930" r="42"/>
    <circle cx="330" cy="930" r="42"/>
    <circle cx="512" cy="930" r="42"/>
    <circle cx="694" cy="930" r="42"/>
    <circle cx="874" cy="930" r="42"/>
  </g>
  <!-- falling star-notes -->
  <g filter="url(#sglow)">
    <use href="#star" transform="translate(470 150) scale(0.55)"/>
    <use href="#star" transform="translate(410 300) scale(0.85)"/>
    <use href="#star" transform="translate(690 230) scale(0.7)"/>
    <use href="#star" transform="translate(300 560) scale(1.05)"/>
    <use href="#star" transform="translate(760 560) scale(1.05)"/>
    <use href="#star" transform="translate(190 780) scale(1.2)"/>
    <use href="#star" transform="translate(834 780) scale(1.2)"/>
  </g>
</svg>
